<svg fill="none" viewBox="0 0 600 400" width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
	<div xmlns="http://www.w3.org/1999/xhtml">
		<style>.container {
		width: 100%;
		margin: 0 auto;
		padding: 0 1rem;
	}

	@media (min-width: 576px) {
		.container {
			max-width: 510px;
			padding-right: 0;
			padding-left: 0;
		}
	}

	@media (min-width: 768px) {
		.container {
			max-width: 700px;
		}
	}

	@media (min-width: 1024px) {
		.container {
			max-width: 950px;
		}
	}

	@media (min-width: 1280px) {
		.container {
			max-width: 1200px;
		}
	}

	@media (min-width: 1536px) {
		.container {
			max-width: 1450px;
		}
	}


	a {
		--pico-text-decoration: underline;
	}

	a.secondary,
	a.contrast {
		--pico-text-decoration: underline;
	}

	small {
		--pico-font-size: 0.875em;
	}

	h1,
	h2,
	h3,
	h4,
	h5,
	h6 {
		--pico-font-weight: 700;
	}

	h1 {
		--pico-font-size: 2rem;
		--pico-line-height: 1.125;
		--pico-typography-spacing-top: 3rem;
	}

	h2 {
		--pico-font-size: 1.75rem;
		--pico-line-height: 1.15;
		--pico-typography-spacing-top: 2.625rem;
	}

	h3 {
		--pico-font-size: 1.5rem;
		--pico-line-height: 1.175;
		--pico-typography-spacing-top: 2.25rem;
	}

	h4 {
		--pico-font-size: 1.25rem;
		--pico-line-height: 1.2;
		--pico-typography-spacing-top: 1.874rem;
	}

	h5 {
		--pico-font-size: 1.125rem;
		--pico-line-height: 1.225;
		--pico-typography-spacing-top: 1.6875rem;
	}

	h6 {
		--pico-font-size: 1rem;
		--pico-line-height: 1.25;
		--pico-typography-spacing-top: 1.5rem;
	}

	@media only screen and (prefers-color-scheme: dark) {
		.container {
			--color-text: #ffffff;
		}
	}

	@media only screen and (prefers-color-scheme: light) {
		.container {
			--color-text: #000000;
		}
	}

	h1,
	h2,
	h3,
	h4,
	h5,
	h6,
	span,
	p {
		color: var(--color-text)
	}

.head-element {
  width: 100%;
  height: 100px; /* Увеличим высоту для плавности */
  background: linear-gradient(135deg, #7599B9, #65568F);
  border: 2px solid #333;
  border-bottom: none;
  
  /* Плавная волна с 5 изгибами (кубические кривые Безье) */
  clip-path: path(
    "M 0,0                           /* Начало (левый верхний угол) */
    L 100%,0                         /* Прямая линия вправо */
    L 100%,70%                       /* Опускаемся вниз */
    C 90%,80% 80%,90% 70%,70%        /* 1-й плавный изгиб */
    C 60%,50% 50%,90% 40%,70%        /* 2-й изгиб */
    C 30%,50% 20%,90% 10%,70%        /* 3-й изгиб */
    C 5%,50% 0%,80% 0%,100%          /* 4-й и 5-й изгибы (левый край) */
    Z"                               /* Замыкаем путь */
  );
}

animation: wave 3s infinite ease-in-out;

@keyframes wave {
  0%, 100% { clip-path: path("M0,0 L100%,0 L100%,70% C90%,80% 80%,90% 70%,70% C..."); }
  50% { clip-path: path("M0,0 L100%,0 L100%,75% C85%,85% 75%,85% 65%,75% C..."); }
}
		</style>
		<div class='body' data-theme="dark">
			<div class='container'>
			<div class="head-element">
				<h1>
				Марк Мишкин
				</h1>
				</div>
				<section class='items'>
				<ul>
					<li>Writer &#38; Software Engineer</li>
				</ul>
				<ul>
					<li>at <a href="https://pragmaticpineapple.com">Pragmatic Pineapple</a></li>
				</ul>
				<ul>
					<li><a href="mailto:nikolaseap@gmail.com" role="button"><span class='hi'>👋</span></a></li>
				</ul>
				</section>
			</div>
		</div>
	</div>
  </foreignObject>
</svg>